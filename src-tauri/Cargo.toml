[package]
name = "sanjeh"
version = "0.1.0"
description = "SANJEH — a local-first exam application"
authors = ["SANJEH"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sanjeh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
