name: Native builds

on:
  workflow_dispatch:
    inputs:
      android_release:
        description: Build signed release APKs and publish a GitHub release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle_dir: src-tauri/target/release/bundle
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage
            bundle_dir: src-tauri/target/release/bundle
          - platform: windows
            arch: x86_64
            runner: windows-latest
            args: --bundles nsis,msi
            bundle_dir: src-tauri/target/release/bundle
          - platform: macos
            arch: arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos
            arch: x86_64
            runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: macos
            arch: universal
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS build targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.bundle_dir }}/**/*
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android — universal and per-ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and build tools
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            # پاک‌سازی باقی‌مانده‌ها قبل از هر تلاش
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            rm -rf "$ANDROID_HOME/.temp"/* 2>/dev/null || true
            rm -rf "$ANDROID_HOME/.downloadIntermediates"/* 2>/dev/null || true

            if sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0"; then
              # تأیید نصب واقعی NDK (وجود source.properties)
              if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK installed successfully."
                break
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "NDK install failed after 3 attempts."
              exit 1
            fi
            echo "Retrying after cleanup..."
            sleep 5
          done

          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci

      - name: Generate app icons
        run: npx tauri icon src-tauri/icon-source/icon.json

      - name: Resolve Android release options
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          requested=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.android_release }}" = "true" ]; then
            requested=true
          fi
          signing=false
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            signing=true
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$signing" = "true" ]; then
            requested=true
          fi
          if [ "$requested" = "true" ] && [ "$signing" != "true" ]; then
            echo "::error::Android release requested but signing secrets are incomplete. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (ANDROID_KEY_PASSWORD is optional)."
            exit 1
          fi
          echo "release=$requested" >> "$GITHUB_OUTPUT"
          echo "Android release build: $requested (signing secrets present: $signing)"

      - name: Configure Android release signing
        if: steps.android-signing.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.mjs --require

      - name: Build universal and per-ABI APKs
        env:
          ANDROID_RELEASE: ${{ steps.android-signing.outputs.release }}
        run: |
          set -euo pipefail
          build_kind=release
          flags=()
          if [ "$ANDROID_RELEASE" != "true" ]; then
            build_kind=debug
            flags+=(--debug)
          fi
          rm -rf src-tauri/gen/android/app/build/outputs/apk artifacts
          echo "Building the $build_kind universal APK..."
          npx tauri android build --apk "${flags[@]}" --ci
          node scripts/stage-android-apks.mjs universal artifacts/android-universal "$build_kind"
          rm -rf src-tauri/gen/android/app/build/outputs/apk
          echo "Building the $build_kind per-ABI APKs..."
          npx tauri android build --apk "${flags[@]}" --split-per-abi --ci
          node scripts/stage-android-apks.mjs split artifacts/android-split "$build_kind"

      - name: Verify release APK signatures
        if: steps.android-signing.outputs.release == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          count=0
          while IFS= read -r -d '' APK; do
            "$APKSIGNER" verify --print-certs "$APK"
            count=$((count + 1))
          done < <(find artifacts/android-universal artifacts/android-split -type f -name '*.apk' -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "Verified $count signed APKs."

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-universal
          path: artifacts/android-universal/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-arm64-v8a
          path: artifacts/android-split/arm64-v8a/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-armeabi-v7a
          path: artifacts/android-split/armeabi-v7a/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-x86
          path: artifacts/android-split/x86/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-x86_64
          path: artifacts/android-split/x86_64/*.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS — simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx tauri ios init --ci

      - name: Generate app icons
        run: npx tauri icon src-tauri/icon-source/icon.json

      - name: Build simulator app (unsigned)
        run: npx tauri ios build --debug --target aarch64-sim

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-ios-simulator
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    needs: [desktop, android, ios]
    if: >-
      needs.desktop.result == 'success' &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.android_release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release-tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            tag="v${version}-build.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: SANJEH ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.apk
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.dmg
