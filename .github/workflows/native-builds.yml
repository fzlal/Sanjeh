name: Native builds

on:
  workflow_dispatch:
    inputs:
      android_release:
        description: Build a signed release APK instead of the debug APK
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage
          - platform: windows
            arch: x86_64
            runner: windows-latest
            args: --bundles nsis,msi
          - platform: macos
            arch: universal
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android — universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and build tools
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            # پاک‌سازی باقی‌مانده‌ها قبل از هر تلاش
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            rm -rf "$ANDROID_HOME/.temp"/* 2>/dev/null || true
            rm -rf "$ANDROID_HOME/.downloadIntermediates"/* 2>/dev/null || true

            if sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0"; then
              # تأیید نصب واقعی NDK (وجود source.properties)
              if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK installed successfully."
                break
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "NDK install failed after 3 attempts."
              exit 1
            fi
            echo "Retrying after cleanup..."
            sleep 5
          done

          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci

      - name: Resolve Android release options
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          requested=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.android_release }}" = "true" ]; then
            requested=true
          fi
          signing=false
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            signing=true
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$signing" = "true" ]; then
            requested=true
          fi
          if [ "$requested" = "true" ] && [ "$signing" != "true" ]; then
            echo "::error::Android release requested but signing secrets are incomplete. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (ANDROID_KEY_PASSWORD is optional)."
            exit 1
          fi
          echo "release=$requested" >> "$GITHUB_OUTPUT"
          echo "Android release build: $requested (signing secrets present: $signing)"

      - name: Configure Android release signing
        if: steps.android-signing.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.mjs --require

      - name: Build debug APK (all ABIs)
        if: steps.android-signing.outputs.release != 'true'
        run: npx tauri android build --apk --debug --ci

      - name: Build signed release APK (all ABIs)
        if: steps.android-signing.outputs.release == 'true'
        run: npx tauri android build --apk --ci

      - name: Verify release APK signature
        if: steps.android-signing.outputs.release == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          found=0
          while IFS= read -r -d '' APK; do
            found=1
            "$APKSIGNER" verify --print-certs "$APK"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

      - name: Upload debug APK
        if: steps.android-signing.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-arm64-armv7-x86_64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.android-signing.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS — simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx tauri ios init --ci

      - name: Build simulator app (unsigned)
        run: npx tauri ios build --debug --target aarch64-sim

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-ios-simulator
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          retention-days: 30
          if-no-files-found: warn
