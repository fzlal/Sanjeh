name: Native builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            args: --bundles deb,rpm,appimage
          - platform: windows
            arch: x86_64
            runner: windows-latest
            args: --bundles nsis,msi
          - platform: macos
            arch: universal
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
          retention-days: 30
          if-no-files-found: error

  android:
    name: Android — universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci

      - name: Build debug APK (all ABIs)
        run: npx tauri android build --apk --debug --ci

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-android-arm64-armv7-x86_64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS — simulator build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx tauri ios init --ci

      - name: Build simulator app (unsigned)
        run: npx tauri ios build --debug --target aarch64-sim

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjeh-ios-simulator
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          retention-days: 30
          if-no-files-found: warn
